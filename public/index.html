<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>MétéoApp - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
  </head>
  <body class="flex flex-col min-h-screen bg-blue-50">
    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN -->
    <main
      class="flex-1 container mx-auto my-16 bg-white p-6 rounded-lg shadow-md max-w-3xl text-center"
    >
      <h2 class="text-3xl font-bold text-teal-700 mb-6">
        Bienvenue sur MétéoApp !
      </h2>
      <!-- Image météo : https://www.flaticon.com/fr/icone-gratuite/application-meteo_7133364 -->
      <img
        src="assets/img/application-meteo.png"
        alt="Icône Météo"
        class="mx-auto w-32 h-32 mb-4"
      />

      <p class="text-lg text-gray-700">
        Consultez la météo actuelle de votre ville en quelques clics !
      </p>
      <a
        href="search.html"
        class="inline-block mt-4 bg-teal-700 text-white px-6 py-3 rounded hover:bg-teal-600 font-semibold"
      >
        Rechercher une ville
      </a>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="assets/js/loadLayout.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
