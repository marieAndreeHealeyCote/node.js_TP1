<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>MétéoApp - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
  </head>
  <body class="flex flex-col min-h-screen bg-blue-50">
    <!-- HEADER -->
    <header class="bg-teal-700 text-white">
      <div
        class="container mx-auto flex justify-between items-center py-4 px-6"
      >
        <h1 class="text-2xl font-bold">MétéoApp 🌤️</h1>
        <nav>
          <ul class="flex gap-6">
            <li>
              <a href="index.html" class="hover:text-teal-300 font-semibold"

            <li>
              <a href="search.html" class="hover:text-teal-300 font-semibold"

            <li>

              >
            </li>
          </ul>
        </nav>
      </div>

    <!-- MAIN -->
    <main
      class="flex-1 container mx-auto my-16 bg-white p-6 rounded-lg shadow-md max-w-3xl text-center"

      <h2 class="text-3xl font-bold text-teal-700 mb-6">
        Bienvenue sur MétéoApp !
      </h2>
      <p class="text-gray-700 mb-4">
        Découvrez la météo actuelle de n’importe quelle ville dans le monde.
      </p>
      <a
        href="search.html"
        class="inline-block mt-4 bg-teal-700 text-white px-6 py-3 rounded hover:bg-teal-600 font-semibold"
      >
        Rechercher une ville

    <!-- FOOTER -->

      <p>© 2026 MétéoApp - Tous droits réservés</p>
