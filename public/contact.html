<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>MétéoApp - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
  </head>
  <body class="flex flex-col min-h-screen bg-blue-50">
    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN -->
    <main
      class="flex-1 container mx-auto my-16 bg-white p-6 rounded-lg shadow-md max-w-3xl"
    >
      <h2 class="text-2xl font-bold text-teal-700 mb-6">Contactez-nous</h2>
      <p class="text-gray-700 mb-4">
        Pour toute question ou suggestion, envoyez-nous un email :
      </p>
      <p class="font-semibold">contact@meteoapp.com</p>

      <h3 class="text-xl font-bold text-teal-700 mt-8 mb-2">
        Ou utilisez le formulaire :
      </h3>
      <form class="flex flex-col gap-4 max-w-md">
        <input type="text" placeholder="Nom" class="p-2 border rounded" />
        <input type="email" placeholder="Email" class="p-2 border rounded" />
        <textarea
          placeholder="Votre message"
          rows="4"
          class="p-2 border rounded"
        ></textarea>
        <button
          type="submit"
          class="bg-teal-700 text-white px-4 py-2 rounded hover:bg-teal-600"
        >
          Envoyer
        </button>
      </form>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="assets/js/loadLayout.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
