<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>MétéoApp - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
  </head>
  <body class="flex flex-col min-h-screen bg-blue-50">
    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN -->
    <main
      class="flex-1 container mx-auto my-8 bg-white p-6 rounded-lg shadow-md max-w-lg"
    >
      <section id="search">
        <h2 class="text-xl font-bold text-teal-700 mb-4">
          Rechercher une ville
        </h2>

        <!-- Formulaire de recherche -->
        <form id="cityForm" class="flex gap-2 mb-4">
          <input
            type="text"
            name="city"
            id="cityInput"
            placeholder="Entrez une ville"
            class="flex-1 p-2 border rounded"
          />
          <button
            type="submit"
            class="bg-teal-700 text-white px-4 rounded hover:bg-teal-600"
          >
            Rechercher
          </button>
        </form>
        <p id="loading" class="text-gray-600 text-center mb-2"></p>
        <div id="results" class="mt-4"></div>

        <!-- Image météo : https://www.flaticon.com/fr/icone-gratuite/application-meteo_7133364 -->
        <img
          src="assets/img/application-meteo.png"
          alt="Icône Météo"
          class="mx-auto w-32 h-32 mb-4"
        />
      </section>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="assets/js/loadLayout.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
